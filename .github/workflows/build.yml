name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        
      - name: Build Tweak
        run: make FINALPACKAGE=1
        
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyDYYY-Dylib
          path: .theos/obj/**/*.dylib
