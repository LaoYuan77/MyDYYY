name: Build dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build dylib
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          # 直接调用 clang 编译，不需要 Theos 环境
          # -dynamiclib: 生成动态库
          # -framework: 链接必要的系统库
          # -arch arm64: 指定 iPhone 架构
          clang -dynamiclib -o MyDYYY.dylib \
            -framework UIKit -framework Foundation \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -arch arm64 Tweak.x -fobjc-arc

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyDYYY-dylib
          path: MyDYYY.dylib
