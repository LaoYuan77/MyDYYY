name: Build dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build dylib
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          # 加上了 -x objective-c 强制告诉编译器这是标准代码
          clang -x objective-c -dynamiclib -o MyDYYY.dylib \
            -framework UIKit -framework Foundation \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -arch arm64 Tweak.x -fobjc-arc

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyDYYY-dylib
          path: MyDYYY.dylib
